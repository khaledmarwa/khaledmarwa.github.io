<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة إدارة المشاريع</title>
<meta name="description" content="نموذج لوحة كانبان لإدارة المهام: أعمدة وبطاقات بالسحب والإفلات، تفاصيل، فلترة، وحفظ محلي — بدون مكتبات.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg:#EEF0F4; --board:#EEF0F4; --col:#E4E7ED; --card:#FFFFFF; --surface:#FFFFFF;
    --ink:#15171C; --ink-soft:#4A505E; --ink-faint:#5C6371;
    --line:#DDE0E7; --line-strong:#C9CDD7;
    --accent:#3B5BDB; --accent-soft:#E6EAFB; --on-accent:#FFFFFF;
    --p-low:#8A93A6; --p-med:#3B5BDB; --p-high:#B5771A; --p-urgent:#C63B3B;
    --danger:#C63B3B; --danger-soft:#FBE9E9;
    --shadow-card:0 1px 2px rgba(20,25,40,.08), 0 1px 1px rgba(20,25,40,.04);
    --shadow-pop:0 6px 16px -4px rgba(20,25,40,.18), 0 12px 40px -12px rgba(20,25,40,.24);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0C0E12; --board:#0C0E12; --col:#14161C; --card:#1B1E25; --surface:#1B1E25;
      --ink:#E7E9EE; --ink-soft:#A7AEBC; --ink-faint:#8992A2;
      --line:#282C34; --line-strong:#363B45;
      --accent:#8098F6; --accent-soft:#1E2436; --on-accent:#0A0E1A;
      --p-low:#828A9C; --p-med:#8098F6; --p-high:#D6A24E; --p-urgent:#E76B6B;
      --danger:#E76B6B; --danger-soft:#2C1919;
      --shadow-card:0 1px 2px rgba(0,0,0,.4);
      --shadow-pop:0 8px 24px -6px rgba(0,0,0,.55), 0 16px 48px -12px rgba(0,0,0,.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0C0E12; --board:#0C0E12; --col:#14161C; --card:#1B1E25; --surface:#1B1E25;
    --ink:#E7E9EE; --ink-soft:#A7AEBC; --ink-faint:#8992A2;
    --line:#282C34; --line-strong:#363B45;
    --accent:#8098F6; --accent-soft:#1E2436; --on-accent:#0A0E1A;
    --p-low:#828A9C; --p-med:#8098F6; --p-high:#D6A24E; --p-urgent:#E76B6B;
    --danger:#E76B6B; --danger-soft:#2C1919;
    --shadow-card:0 1px 2px rgba(0,0,0,.4);
    --shadow-pop:0 8px 24px -6px rgba(0,0,0,.55), 0 16px 48px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }

  * , *::before, *::after { box-sizing:border-box; }
  html, body { height:100%; }
  html { direction:rtl; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Rubik','Segoe UI',Tahoma,sans-serif; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  h1,h2,h3 { margin:0; font-weight:600; }
  button { font-family:inherit; }

  /* ===== Top bar ===== */
  .topbar {
    flex:none; display:flex; align-items:center; gap:.7rem; flex-wrap:wrap;
    padding:.7rem clamp(.8rem,2vw,1.4rem);
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:.55rem; }
  .brand .mk { width:32px; height:32px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-size:1rem; flex:none; }
  .brand h1 { font-size:1.02rem; }
  .brand .pj { font-size:.72rem; color:var(--ink-faint); }

  .stats { display:flex; gap:.5rem; }
  .stat { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:.25rem .6rem; font-size:.76rem; color:var(--ink-soft); display:flex; gap:.35rem; align-items:center; }
  .stat b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .stat.warn b { color:var(--danger); }

  .tools { margin-inline-start:auto; display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  input, select {
    font-family:inherit; font-size:.83rem; color:var(--ink);
    background:var(--bg); border:1px solid var(--line-strong); border-radius:8px; padding:.42rem .6rem;
  }
  input:focus, select:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .search { width:150px; }
  .btn {
    font-size:.83rem; font-weight:500; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; gap:.35rem;
    padding:.45rem .75rem; border-radius:8px;
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  }
  .btn:hover { border-color:var(--accent); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .btn-icon { padding:.42rem; }
  .btn-sm { padding:.35rem .6rem; font-size:.78rem; }

  /* ===== Board ===== */
  .board {
    flex:1; min-height:0;
    display:flex; gap:.85rem; align-items:flex-start;
    padding:clamp(.8rem,2vw,1.3rem);
    overflow-x:auto; overflow-y:hidden;
  }
  .column {
    flex:none; width:290px; max-height:100%;
    background:var(--col); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column;
  }
  .col-head { display:flex; align-items:center; gap:.5rem; padding:.7rem .8rem .5rem; }
  .col-head .name {
    font-weight:600; font-size:.9rem; color:var(--ink);
    background:transparent; border:1px solid transparent; border-radius:6px;
    padding:.15rem .3rem; margin-inline-start:-.3rem; flex:1; min-width:0;
  }
  .col-head .name:focus { outline:none; border-color:var(--accent); background:var(--surface); }
  .col-head .count { font-size:.74rem; color:var(--ink-faint); background:var(--bg); border-radius:99px; padding:.05rem .5rem; font-variant-numeric:tabular-nums; }
  .col-head .col-del { background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:1rem; padding:.1rem .3rem; border-radius:6px; }
  .col-head .col-del:hover { color:var(--danger); background:var(--danger-soft); }

  .card-list {
    flex:1; overflow-y:auto; padding:.3rem .55rem .1rem;
    display:flex; flex-direction:column; gap:.5rem;
    min-height:14px;
  }
  .card-list.drop-hover { background:var(--accent-soft); }

  .add-card {
    margin:.35rem .55rem .55rem; padding:.5rem;
    border:1px dashed var(--line-strong); border-radius:9px;
    background:transparent; color:var(--ink-faint); font-size:.82rem; cursor:pointer; text-align:right;
  }
  .add-card:hover { border-color:var(--accent); color:var(--accent); }
  .add-card-form { margin:.35rem .55rem .55rem; display:none; }
  .add-card-form.on { display:block; }
  .add-card-form textarea {
    width:100%; font-family:inherit; font-size:.84rem; color:var(--ink);
    background:var(--surface); border:1px solid var(--accent); border-radius:9px; padding:.5rem .6rem; resize:vertical; min-height:52px;
  }
  .add-card-form .row { display:flex; gap:.4rem; margin-top:.4rem; }

  /* ===== Card ===== */
  .card {
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:.6rem .7rem; box-shadow:var(--shadow-card); cursor:grab;
    touch-action:none;
  }
  .card:hover { border-color:var(--line-strong); }
  .card.dragging { opacity:.35; }
  .card .labels { display:flex; flex-wrap:wrap; gap:.3rem; margin-bottom:.4rem; }
  .lbl { font-size:.66rem; font-weight:600; color:#fff; padding:.08rem .42rem; border-radius:99px; }
  .card .title { font-size:.86rem; color:var(--ink); font-weight:500; }
  .card .foot { display:flex; align-items:center; gap:.5rem; margin-top:.5rem; }
  .chip-due { font-size:.7rem; color:var(--ink-faint); display:flex; align-items:center; gap:.25rem; }
  .chip-due.over { color:var(--danger); font-weight:600; }
  .prio { width:8px; height:8px; border-radius:99px; flex:none; }
  .prio.low{background:var(--p-low)} .prio.med{background:var(--p-med)} .prio.high{background:var(--p-high)} .prio.urgent{background:var(--p-urgent)}
  .avatar { margin-inline-start:auto; width:22px; height:22px; border-radius:99px; display:grid; place-items:center; font-size:.68rem; font-weight:600; color:#fff; flex:none; }
  .card .desc-flag { font-size:.72rem; color:var(--ink-faint); }

  .drag-ghost { position:fixed; top:0; left:0; z-index:2000; pointer-events:none; width:270px; box-shadow:var(--shadow-pop); rotate:2.5deg; }
  .drop-indicator { height:3px; background:var(--accent); border-radius:2px; margin:1px 2px; box-shadow:0 0 0 3px var(--accent-soft); }
  body.is-dragging { cursor:grabbing; }
  body.is-dragging * { cursor:grabbing !important; user-select:none; }

  /* ===== Dialog (card detail) ===== */
  dialog {
    border:none; border-radius:16px; padding:0; width:min(520px,94vw);
    background:var(--surface); color:var(--ink); box-shadow:var(--shadow-pop);
  }
  dialog::backdrop { background:rgba(8,10,16,.55); }
  .d-head { display:flex; align-items:flex-start; gap:.5rem; padding:1rem 1.2rem .8rem; border-bottom:1px solid var(--line); }
  .d-head textarea {
    flex:1; font-family:inherit; font-size:1rem; font-weight:600; color:var(--ink); line-height:1.4;
    background:transparent; border:1px solid transparent; border-radius:8px; padding:.2rem .35rem; resize:none; min-height:2.6em;
  }
  .d-head textarea:focus { outline:none; border-color:var(--accent); }
  .d-head .x { background:none; border:none; color:var(--ink-faint); font-size:1.3rem; cursor:pointer; padding:.1rem .3rem; line-height:1; }
  .d-body { padding:1.1rem 1.2rem; display:grid; gap:1rem; }
  .d-row { display:grid; grid-template-columns:6rem 1fr; gap:.7rem; align-items:start; }
  .d-row > .k { font-size:.8rem; color:var(--ink-faint); padding-top:.4rem; }
  .d-labels { display:flex; flex-wrap:wrap; gap:.4rem; }
  .lbl-toggle { font-size:.72rem; font-weight:600; color:#fff; padding:.2rem .55rem; border-radius:99px; cursor:pointer; opacity:.4; border:none; }
  .lbl-toggle.on { opacity:1; }
  .d-body textarea.desc {
    width:100%; font-family:inherit; font-size:.86rem; color:var(--ink); line-height:1.6;
    background:var(--bg); border:1px solid var(--line-strong); border-radius:9px; padding:.6rem .7rem; resize:vertical; min-height:70px;
  }
  .d-foot { padding:.9rem 1.2rem; border-top:1px solid var(--line); display:flex; gap:.5rem; }
  .d-foot .del { margin-inline-start:auto; color:var(--danger); border-color:transparent; background:transparent; }

  .empty-col { font-size:.76rem; color:var(--ink-faint); text-align:center; padding:.8rem 0; }

  .toast {
    position:fixed; inset-block-end:1.1rem; inset-inline:0; margin-inline:auto; width:max-content; max-width:90vw;
    background:var(--ink); color:var(--bg); font-size:.83rem; font-weight:500;
    padding:.6rem 1rem; border-radius:9px; z-index:3000;
    opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none;
  }
  .toast.show { opacity:1; transform:none; }
  .demo-tag { position:fixed; inset-block-end:10px; inset-inline-start:10px; z-index:100; background:var(--surface); border:1px solid var(--line); color:var(--ink-faint); font-size:.7rem; padding:.25rem .55rem; border-radius:99px; }

  @media (max-width:640px) {
    .stats { display:none; }
    .search { width:110px; }
    .column { width:82vw; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mk">◨</span>
    <div><h1>لوحة المشاريع</h1><div class="pj">إطلاق تطبيق المتجر — الربع الأول</div></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="بحث…" aria-label="بحث">
    <select id="fLabel" aria-label="تصفية بالوسم"><option value="">كل الوسوم</option></select>
    <select id="fPrio" aria-label="تصفية بالأولوية">
      <option value="">كل الأولويات</option>
      <option value="urgent">عاجلة</option><option value="high">عالية</option>
      <option value="med">متوسطة</option><option value="low">منخفضة</option>
    </select>
    <button class="btn" id="btnAddCol" type="button">＋ عمود</button>
    <button class="btn btn-icon" id="btnTheme" type="button" aria-label="السمة">◐</button>
    <button class="btn btn-icon" id="btnReset" type="button" aria-label="تصفير" title="استعادة البيانات التجريبية">↺</button>
  </div>
</div>

<div class="board" id="board"></div>

<dialog id="cardDlg">
  <div class="d-head">
    <textarea id="dTitle" rows="1" aria-label="عنوان المهمة"></textarea>
    <button class="x" type="button" data-close>×</button>
  </div>
  <div class="d-body">
    <div class="d-row"><span class="k">الوسوم</span><div class="d-labels" id="dLabels"></div></div>
    <div class="d-row"><span class="k">الأولوية</span>
      <select id="dPrio">
        <option value="low">منخفضة</option><option value="med">متوسطة</option>
        <option value="high">عالية</option><option value="urgent">عاجلة</option>
      </select>
    </div>
    <div class="d-row"><span class="k">تاريخ الاستحقاق</span><input id="dDue" type="date"></div>
    <div class="d-row"><span class="k">المسؤول</span>
      <select id="dAssignee"><option value="">— غير محدد —</option></select>
    </div>
    <div class="d-row"><span class="k">الوصف</span><textarea class="desc" id="dDesc" placeholder="أضف تفاصيل…"></textarea></div>
  </div>
  <div class="d-foot">
    <button class="btn btn-primary" id="dSave" type="button">حفظ</button>
    <button class="btn" type="button" data-close>إغلاق</button>
    <button class="btn del" id="dDelete" type="button">حذف المهمة</button>
  </div>
</dialog>

<div class="toast" id="toast"></div>
<div class="demo-tag">نموذج تجريبي · بيانات محلية</div>

<script>
(function () {
  "use strict";
  var root = document.documentElement; root.lang = 'ar'; root.dir = 'rtl';
  var $ = function (s, r) { return (r || document).querySelector(s); };

  /* ===========================================================================
     1. البيانات
     =========================================================================== */
  var LABELS = {
    design:  { t: 'تصميم',  c: '#6244C9' },
    dev:     { t: 'برمجة',  c: '#216691' },
    bug:     { t: 'خطأ',    c: '#B23A3A' },
    enhance: { t: 'تحسين',  c: '#1B7A4A' },
    content: { t: 'محتوى',  c: '#8C5211' },
    qa:      { t: 'اختبار', c: '#A5397E' }
  };
  var PRIO = { low: 'منخفضة', med: 'متوسطة', high: 'عالية', urgent: 'عاجلة' };
  var PEOPLE = ['نورة', 'خالد', 'ريم', 'فهد', 'سارة'];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function daysFromNow(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

  function seed() {
    return {
      columns: [
        { id: uid(), name: 'الأفكار', cards: [
          { id: uid(), title: 'دراسة منافسين للسلة والدفع', desc: 'مقارنة ٣ متاجر منافسة من ناحية تجربة الشراء.', labels: ['content'], priority: 'low', due: null, assignee: 'ريم' },
          { id: uid(), title: 'اقتراح هوية بصرية بديلة', desc: '', labels: ['design'], priority: 'low', due: daysFromNow(9), assignee: 'نورة' },
          { id: uid(), title: 'تكامل مع بوابة دفع محلية', desc: 'التحقق من متطلبات مدى و Apple Pay.', labels: ['dev', 'enhance'], priority: 'med', due: daysFromNow(14), assignee: 'خالد' }
        ]},
        { id: uid(), name: 'قيد التنفيذ', cards: [
          { id: uid(), title: 'صفحة تفاصيل المنتج', desc: 'معرض صور + خيارات (اللون/المقاس) + إضافة للسلة.', labels: ['dev', 'design'], priority: 'high', due: daysFromNow(2), assignee: 'خالد' },
          { id: uid(), title: 'كتابة نصوص صفحة «من نحن»', desc: '', labels: ['content'], priority: 'med', due: daysFromNow(4), assignee: 'ريم' },
          { id: uid(), title: 'إصلاح: السلة تُفرَّغ عند تحديث الصفحة', desc: 'الحفظ في localStorage لا يتم قبل الانتقال.', labels: ['bug'], priority: 'urgent', due: daysFromNow(-1), assignee: 'فهد' }
        ]},
        { id: uid(), name: 'مراجعة', cards: [
          { id: uid(), title: 'مراجعة تصميم الصفحة الرئيسية', desc: 'التأكد من التجاوب على الجوال.', labels: ['design', 'qa'], priority: 'high', due: daysFromNow(1), assignee: 'نورة' },
          { id: uid(), title: 'اختبار نموذج التسجيل', desc: '', labels: ['qa'], priority: 'med', due: daysFromNow(-2), assignee: 'سارة' }
        ]},
        { id: uid(), name: 'مكتمل', cards: [
          { id: uid(), title: 'إعداد المستودع وبيئة العمل', desc: '', labels: ['dev'], priority: 'low', due: null, assignee: 'خالد' },
          { id: uid(), title: 'شعار المشروع النهائي', desc: '', labels: ['design'], priority: 'low', due: null, assignee: 'نورة' },
          { id: uid(), title: 'خطة الإطلاق', desc: 'الجدول الزمني معتمد.', labels: ['content'], priority: 'med', due: null, assignee: 'ريم' }
        ]}
      ]
    };
  }

  var KEY = 'kanban-demo-v1';
  var state;
  function load() {
    try { var raw = localStorage.getItem(KEY); if (raw) { state = JSON.parse(raw); return; } } catch (e) {}
    state = seed();
    save();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  /* ===========================================================================
     2. حسابات مشتقة + الفلترة
     =========================================================================== */
  var filter = { q: '', label: '', prio: '' };

  function cardMatches(card) {
    if (filter.q) {
      var q = filter.q.toLowerCase();
      if ((card.title + ' ' + (card.desc || '')).toLowerCase().indexOf(q) < 0) return false;
    }
    if (filter.label && card.labels.indexOf(filter.label) < 0) return false;
    if (filter.prio && card.priority !== filter.prio) return false;
    return true;
  }
  function isOverdue(card, colIndex) {
    return card.due && card.due < daysFromNow(0) && colIndex !== state.columns.length - 1;
  }
  function allCards() { return state.columns.reduce(function (a, c) { return a.concat(c.cards); }, []); }
  function findCard(id) {
    for (var i = 0; i < state.columns.length; i++) {
      var idx = state.columns[i].cards.findIndex(function (c) { return c.id === id; });
      if (idx > -1) return { col: state.columns[i], colIndex: i, index: idx, card: state.columns[i].cards[idx] };
    }
    return null;
  }

  function renderStats() {
    var total = allCards().length;
    var done = state.columns[state.columns.length - 1].cards.length;
    var over = 0;
    state.columns.forEach(function (c, ci) { c.cards.forEach(function (card) { if (isOverdue(card, ci)) over++; }); });
    $('#stats').innerHTML =
      '<span class="stat">المهام <b>' + total + '</b></span>' +
      '<span class="stat">مكتملة <b>' + done + '</b></span>' +
      (over ? '<span class="stat warn">متأخرة <b>' + over + '</b></span>' : '');
  }

  /* ===========================================================================
     3. الرسم
     =========================================================================== */
  function avatarColor(name) {
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + h + ' 45% 45%)';
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
  function fmtDue(d) {
    var dt = new Date(d + 'T00:00:00'), t = new Date(); t.setHours(0, 0, 0, 0);
    var diff = Math.round((dt - t) / 86400000);
    if (diff === 0) return 'اليوم';
    if (diff === 1) return 'غدًا';
    if (diff === -1) return 'أمس';
    if (diff < 0) return 'متأخرة ' + (-diff) + 'ي';
    if (diff < 7) return 'خلال ' + diff + 'ي';
    return dt.toLocaleDateString('en-GB');
  }

  function cardHTML(card, colIndex) {
    var labels = card.labels.map(function (k) {
      return LABELS[k] ? '<span class="lbl" style="background:' + LABELS[k].c + '">' + LABELS[k].t + '</span>' : '';
    }).join('');
    var over = isOverdue(card, colIndex);
    var due = card.due ? '<span class="chip-due' + (over ? ' over' : '') + '">🗓 ' + esc(fmtDue(card.due)) + '</span>' : '';
    var avatar = card.assignee
      ? '<span class="avatar" style="background:' + avatarColor(card.assignee) + '" title="' + esc(card.assignee) + '">' + esc(card.assignee[0]) + '</span>' : '';
    var descFlag = card.desc ? '<span class="desc-flag" title="يحتوي وصفًا">≡</span>' : '';
    return '<div class="card" data-id="' + card.id + '" tabindex="0" role="button">' +
      (labels ? '<div class="labels">' + labels + '</div>' : '') +
      '<div class="title">' + esc(card.title) + '</div>' +
      '<div class="foot"><span class="prio ' + card.priority + '" title="' + PRIO[card.priority] + '"></span>' +
      descFlag + due + avatar + '</div>' +
      '</div>';
  }

  function render() {
    var board = $('#board');
    board.innerHTML = state.columns.map(function (col, ci) {
      var visible = col.cards.filter(cardMatches);
      var anyFilter = filter.q || filter.label || filter.prio;
      var cards = visible.map(function (c) { return cardHTML(c, ci); }).join('');
      if (!cards) cards = '<div class="empty-col">' + (anyFilter ? 'لا مهام مطابقة' : 'لا مهام') + '</div>';
      return '<div class="column" data-id="' + col.id + '">' +
        '<div class="col-head">' +
          '<input class="name" value="' + esc(col.name) + '" aria-label="اسم العمود">' +
          '<span class="count">' + visible.length + (anyFilter ? '/' + col.cards.length : '') + '</span>' +
          '<button class="col-del" type="button" title="حذف العمود">🗑</button>' +
        '</div>' +
        '<div class="card-list">' + cards + '</div>' +
        '<button class="add-card" type="button">＋ إضافة مهمة</button>' +
        '<div class="add-card-form"><textarea placeholder="عنوان المهمة…" rows="2"></textarea>' +
          '<div class="row"><button class="btn btn-primary btn-sm add-confirm" type="button">إضافة</button>' +
          '<button class="btn btn-sm add-cancel" type="button">إلغاء</button></div></div>' +
        '</div>';
    }).join('');
    renderStats();
    fillLabelFilter();
  }

  function fillLabelFilter() {
    var sel = $('#fLabel');
    if (sel.options.length > 1) return;
    Object.keys(LABELS).forEach(function (k) {
      var o = document.createElement('option'); o.value = k; o.textContent = LABELS[k].t; sel.appendChild(o);
    });
  }

  /* ===========================================================================
     4. السحب والإفلات (Pointer Events — يعمل باللمس والفأرة)
     =========================================================================== */
  var drag = null;
  var board = $('#board');

  board.addEventListener('pointerdown', function (e) {
    var cardEl = e.target.closest('.card');
    if (!cardEl) return;
    if (e.target.closest('button, a, input, textarea, select')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    drag = {
      id: cardEl.dataset.id, el: cardEl,
      fromCol: cardEl.closest('.column').dataset.id,
      sx: e.clientX, sy: e.clientY, active: false, pid: e.pointerId
    };
    try { cardEl.setPointerCapture(e.pointerId); } catch (err) {}
  });

  board.addEventListener('pointermove', function (e) {
    if (!drag || drag.pid !== e.pointerId) return;
    if (!drag.active) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;
      beginDrag(e);
    }
    e.preventDefault();
    var r = drag.el.getBoundingClientRect();
    drag.ghost.style.transform = 'translate(' + (e.clientX - drag.ox) + 'px,' + (e.clientY - drag.oy) + 'px) rotate(2.5deg)';

    drag.ghost.style.visibility = 'hidden';
    var under = document.elementFromPoint(e.clientX, e.clientY);
    drag.ghost.style.visibility = '';
    var col = under && under.closest('.column');
    if (!col) return;
    var list = $('.card-list', col);
    var siblings = [].slice.call(list.querySelectorAll('.card:not(.dragging)'));
    var before = null;
    for (var i = 0; i < siblings.length; i++) {
      var sr = siblings[i].getBoundingClientRect();
      if (e.clientY < sr.top + sr.height / 2) { before = siblings[i]; break; }
    }
    if (before) list.insertBefore(drag.indicator, before);
    else {
      var emptyMsg = $('.empty-col', list);
      if (emptyMsg) emptyMsg.remove();
      list.appendChild(drag.indicator);
    }
  });

  function beginDrag(e) {
    drag.active = true;
    document.body.classList.add('is-dragging');
    var r = drag.el.getBoundingClientRect();
    drag.ox = e.clientX - r.left;
    drag.oy = e.clientY - r.top;
    drag.ghost = drag.el.cloneNode(true);
    drag.ghost.className = 'card drag-ghost';
    drag.ghost.style.width = r.width + 'px';
    drag.ghost.style.transform = 'translate(' + r.left + 'px,' + r.top + 'px) rotate(2.5deg)';
    document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');
    drag.indicator = document.createElement('div');
    drag.indicator.className = 'drop-indicator';
  }

  function finishDrag() {
    if (!drag || !drag.active) { drag = null; return; }
    var list = drag.indicator.parentElement;
    if (list) {
      var toCol = list.closest('.column').dataset.id;
      var idx = 0, ch = list.children;
      for (var i = 0; i < ch.length; i++) {
        if (ch[i] === drag.indicator) break;
        if (ch[i].classList.contains('card') && !ch[i].classList.contains('dragging')) idx++;
      }
      moveCard(drag.id, drag.fromCol, toCol, idx);
    }
    if (drag.ghost) drag.ghost.remove();
    if (drag.indicator) drag.indicator.remove();
    document.body.classList.remove('is-dragging');
    drag = null;
    render(); save();
  }
  board.addEventListener('pointerup', finishDrag);
  board.addEventListener('pointercancel', function () {
    if (drag && drag.ghost) drag.ghost.remove();
    if (drag && drag.indicator) drag.indicator.remove();
    document.body.classList.remove('is-dragging');
    if (drag && drag.el) drag.el.classList.remove('dragging');
    drag = null;
    render();
  });

  function moveCard(id, fromColId, toColId, toIndex) {
    var from = state.columns.find(function (c) { return c.id === fromColId; });
    var to = state.columns.find(function (c) { return c.id === toColId; });
    if (!from || !to) return;
    var i = from.cards.findIndex(function (c) { return c.id === id; });
    if (i < 0) return;
    var card = from.cards.splice(i, 1)[0];
    // إذا كان نفس العمود وحذفنا عنصرًا قبل موضع الإفلات، فالفهرس الآن صحيح كما هو
    to.cards.splice(toIndex, 0, card);
  }

  /* ===========================================================================
     5. تفاصيل المهمة (نافذة)
     =========================================================================== */
  var dlg = $('#cardDlg'), editingId = null;

  function openCard(id) {
    var f = findCard(id); if (!f) return;
    editingId = id;
    var c = f.card;
    $('#dTitle').value = c.title;
    $('#dPrio').value = c.priority;
    $('#dDue').value = c.due || '';
    $('#dDesc').value = c.desc || '';
    var asg = $('#dAssignee');
    asg.innerHTML = '<option value="">— غير محدد —</option>' + PEOPLE.map(function (p) {
      return '<option' + (p === c.assignee ? ' selected' : '') + '>' + esc(p) + '</option>';
    }).join('');
    $('#dLabels').innerHTML = Object.keys(LABELS).map(function (k) {
      return '<button type="button" class="lbl-toggle' + (c.labels.indexOf(k) > -1 ? ' on' : '') +
        '" data-k="' + k + '" style="background:' + LABELS[k].c + '">' + LABELS[k].t + '</button>';
    }).join('');
    autoGrow($('#dTitle'));
    dlg.showModal();
  }

  $('#dLabels').addEventListener('click', function (e) {
    var b = e.target.closest('.lbl-toggle'); if (b) b.classList.toggle('on');
  });

  $('#dSave').addEventListener('click', function () {
    var f = findCard(editingId); if (!f) return;
    var c = f.card;
    c.title = $('#dTitle').value.trim() || c.title;
    c.priority = $('#dPrio').value;
    c.due = $('#dDue').value || null;
    c.desc = $('#dDesc').value.trim();
    c.assignee = $('#dAssignee').value || null;
    c.labels = [].slice.call($('#dLabels').querySelectorAll('.lbl-toggle.on')).map(function (b) { return b.dataset.k; });
    save(); render(); dlg.close(); toast('تم حفظ المهمة');
  });

  $('#dDelete').addEventListener('click', function () {
    var f = findCard(editingId); if (!f) return;
    if (confirm('حذف «' + f.card.title + '»؟')) {
      f.col.cards.splice(f.index, 1);
      save(); render(); dlg.close(); toast('تم حذف المهمة');
    }
  });

  document.querySelectorAll('[data-close]').forEach(function (b) {
    b.addEventListener('click', function () { dlg.close(); });
  });

  function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  $('#dTitle').addEventListener('input', function () { autoGrow(this); });

  /* ===========================================================================
     6. أحداث اللوحة (فتح مهمة، إضافة، أعمدة)
     =========================================================================== */
  board.addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (card && !drag) { openCard(card.dataset.id); return; }

    var addBtn = e.target.closest('.add-card');
    if (addBtn) {
      var form = addBtn.nextElementSibling;
      addBtn.style.display = 'none'; form.classList.add('on');
      $('textarea', form).focus();
      return;
    }
    var cancel = e.target.closest('.add-cancel');
    if (cancel) {
      var form2 = cancel.closest('.add-card-form');
      form2.classList.remove('on'); form2.previousElementSibling.style.display = '';
      $('textarea', form2).value = '';
      return;
    }
    var confirmAdd = e.target.closest('.add-confirm');
    if (confirmAdd) {
      var form3 = confirmAdd.closest('.add-card-form');
      var val = $('textarea', form3).value.trim();
      if (val) {
        var colId = confirmAdd.closest('.column').dataset.id;
        var col = state.columns.find(function (c) { return c.id === colId; });
        col.cards.push({ id: uid(), title: val, desc: '', labels: [], priority: 'med', due: null, assignee: null });
        save(); render(); toast('تمت إضافة المهمة');
      }
      return;
    }
    var colDel = e.target.closest('.col-del');
    if (colDel) {
      var cid = colDel.closest('.column').dataset.id;
      var c = state.columns.find(function (x) { return x.id === cid; });
      if (state.columns.length <= 1) { toast('لا يمكن حذف آخر عمود'); return; }
      if (c.cards.length === 0 || confirm('حذف عمود «' + c.name + '» و' + c.cards.length + ' مهمة؟')) {
        state.columns = state.columns.filter(function (x) { return x.id !== cid; });
        save(); render();
      }
      return;
    }
  });

  // إضافة مهمة بمفتاح Enter
  board.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches('.add-card-form textarea') && !e.shiftKey) {
      e.preventDefault();
      $('.add-confirm', e.target.closest('.add-card-form')).click();
    }
    if (e.key === 'Enter' && e.target.classList.contains('card')) { e.preventDefault(); openCard(e.target.dataset.id); }
  });

  // إعادة تسمية عمود
  board.addEventListener('change', function (e) {
    if (e.target.classList.contains('name')) {
      var cid = e.target.closest('.column').dataset.id;
      var c = state.columns.find(function (x) { return x.id === cid; });
      c.name = e.target.value.trim() || c.name;
      save(); renderStats();
    }
  });

  $('#btnAddCol').addEventListener('click', function () {
    state.columns.push({ id: uid(), name: 'عمود جديد', cards: [] });
    save(); render();
    board.scrollLeft = -board.scrollWidth;
  });

  /* ===========================================================================
     7. الفلاتر + السمة + التصفير
     =========================================================================== */
  $('#search').addEventListener('input', function (e) { filter.q = e.target.value; render(); });
  $('#fLabel').addEventListener('change', function (e) { filter.label = e.target.value; render(); });
  $('#fPrio').addEventListener('change', function (e) { filter.prio = e.target.value; render(); });

  try { var th = localStorage.getItem('kanban-theme'); if (th) root.setAttribute('data-theme', th); } catch (e) {}
  $('#btnTheme').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('kanban-theme', next); } catch (e) {}
  });

  $('#btnReset').addEventListener('click', function () {
    if (confirm('استعادة البيانات التجريبية؟ سيُحذف كل تغيير.')) {
      state = seed(); filter = { q: '', label: '', prio: '' };
      $('#search').value = ''; $('#fLabel').value = ''; $('#fPrio').value = '';
      save(); render(); toast('تمت الاستعادة');
    }
  });

  var toastT;
  function toast(m) { var el = $('#toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('show'); }, 2200); }

  /* ===== init ===== */
  load();
  render();
})();
</script>
</body>
</html>
